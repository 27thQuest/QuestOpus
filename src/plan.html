<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Plan — Quest Opus</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="page">

    <!-- Header -->
    <div class="mobile-header">
      <div class="app-title">
        <div>MAKE EVERY WEEK</div>
        <div>YOUR MAGNUM OPUS</div>
      </div>
      <button class="menu-btn" aria-label="Menu">☰</button>
    </div>

    <!-- Page heading -->
    <section class="page-heading">
      <h1>Plan</h1>
      <p>Design how you want to spend your week.</p>
    </section>

    <!-- Weekly time budget -->
    <section class="time-budget">

      <div class="time-budget__head">
        <div>
          <h2>Your Week</h2>
          <p>168 hours</p>
        </div>

        <div class="time-budget__summary">
          <strong id="plan-unallocated">168h</strong>
          <span>unallocated</span>
        </div>
      </div>

      <!-- 168-hour visualization -->
      <div class="time-budget__bar" id="time-budget-bar" aria-label="Weekly time allocation">
        <!-- Generated by plan.js -->
      </div>

      <div class="time-budget__legend" id="time-budget-legend">
        <!-- Generated by plan.js -->
      </div>

      <div class="time-budget__totals">
        <div>
          <span>Allocated</span>
          <strong id="plan-allocated">0h</strong>
        </div>

        <div>
          <span>Unallocated</span>
          <strong id="plan-unallocated-bottom">168h</strong>
        </div>
      </div>

    </section>

    <!-- Time allocation -->
    <section class="allocation-section">

      <div class="section-heading">
        <div>
          <h2>Time Allocation</h2>
          <p>Set how much time you want to give each subject.</p>
        </div>
      </div>

      <div class="allocation-list" id="allocation-list">
        <!-- Allocation rows generated by plan.js -->
      </div>


    </section>

  </main>

  <!-- Bottom navigation -->
  <nav class="nav">
    <div class="nav__links">

      <a class="nav__link" href="index.html">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <polyline points="12 7 12 12 15 15" />
        </svg>
        <span>Timer</span>
      </a>

      <a class="nav__link is-current" href="plan.html">
        <svg viewBox="0 0 24 24">
          <path d="M5 4h14v16H5z" />
          <line x1="8" y1="8" x2="16" y2="8" />
          <line x1="8" y1="12" x2="16" y2="12" />
          <line x1="8" y1="16" x2="13" y2="16" />
        </svg>
        <span>Plan</span>
      </a>

      <a class="nav__link" href="analytics.html">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="12" width="4" height="9" />
          <rect x="10" y="7" width="4" height="14" />
          <rect x="17" y="3" width="4" height="18" />
        </svg>
        <span>Analytics</span>
      </a>

      <a class="nav__link" href="todo.html">
        <svg viewBox="0 0 24 24">
          <line x1="8" y1="6" x2="21" y2="6" />
          <line x1="8" y1="12" x2="21" y2="12" />
          <line x1="8" y1="18" x2="21" y2="18" />
          <polyline points="3 6 4 7 6 5" />
          <polyline points="3 12 4 13 6 11" />
          <polyline points="3 18 4 19 6 17" />
        </svg>
        <span>Todo</span>
      </a>

    </div>
  </nav>

  <script src="db.js"></script>
  <script src="plan.js"></script>

</body>

</html>
